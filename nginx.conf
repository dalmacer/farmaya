server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas de la API: se pasan al backend Node (mismo dominio/puerto,
    # así el navegador nunca mezcla HTTP con HTTPS)
    location ~ ^/(query|responses|respond|registro|farmacia|admin)($|/) {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Resto: archivos estáticos (admin.html, cliente.html, etc.)
    location / {
        try_files $uri $uri/ =404;
    }
}
